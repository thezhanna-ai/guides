<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <meta name="description" content="{description}">
  <!-- Страница собрана из data/statyi.json скриптом scripts/sobrat_glavnuyu.py
       Руками не править: правка затрётся следующей сборкой -->
  <style>
    :root {{
      --ink: #102F30;
      --text: #24302D;
      --paper: #F8F7F2;
      --card: #FFFFFF;
      --sage: #E2E8E9;
      --sage-line: #BBC7CA;
      --accent: #E86F4A;
      --muted: #65716D;
      --green: #3E8E5A;
      --green-bg: #E4F1E8;
      --blue: #2C6FA6;
      --blue-bg: #E4EDF5;
      --red: #B4442E;
      --red-bg: #F5E6E2;
      --black: #2A2A2A;
      --black-bg: #E7E5E3;
    }}
    * {{ box-sizing: border-box }}
    body {{
      margin: 0;
      background: var(--paper);
      color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }}
    header, main {{ width: min(1120px, calc(100% - 40px)); margin: 0 auto }}
    header {{ padding: 66px 0 30px }}
    .eyebrow {{ margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase }}
    h1 {{ max-width: 760px; margin: 0; color: var(--ink); font-size: clamp(36px, 7vw, 68px); line-height: 1.04 }}
    .lead {{ max-width: 680px; margin: 22px 0 0; font: 22px/1.5 Georgia, serif }}
    .intro {{ max-width: 680px; margin: 16px 0 0; color: var(--muted); font-size: 17px; line-height: 1.6 }}
    .levels {{ max-width: 680px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 17px; line-height: 1.6 }}
    .levels li {{ display: flex; align-items: baseline; gap: 10px; margin-top: 8px }}
    .levels b {{ color: var(--ink) }}

    /* Поиск и фильтр по тегам */
    .toolbar {{ display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 30px 0 6px; padding: 18px; border: 1px solid var(--sage-line); border-radius: 14px; background: var(--card) }}
    .search-input {{
      flex: 1 1 240px;
      min-width: 200px;
      padding: 11px 14px;
      border: 1px solid var(--sage-line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }}
    .search-input:focus {{ outline: 2px solid var(--accent); outline-offset: 1px }}
    .tag-filters {{ display: flex; flex-wrap: wrap; gap: 8px }}
    .tag-btn {{
      padding: 8px 14px;
      border: 1px solid var(--sage-line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .1s ease, background .15s ease, color .15s ease, border-color .15s ease;
    }}
    .tag-btn:hover {{ transform: translateY(-1px) }}
    .tag-btn.active {{ background: var(--ink); color: var(--paper); border-color: var(--ink) }}
    .no-results {{ display: none; margin: 30px 0; padding: 22px; border: 1px dashed var(--sage-line); border-radius: 12px; color: var(--muted); text-align: center }}
    .no-results.show {{ display: block }}

    /* Блоки верхнего уровня */
    .tool-block {{ margin: 40px 0 0 }}
    .tool-block:first-of-type {{ margin-top: 26px }}
    .tool-head {{ display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }}
    .tool-head h2 {{ margin: 0; color: var(--ink); font-size: 30px; line-height: 1.15 }}
    .tool-head p {{ margin: 0; color: var(--muted); font-size: 15px }}

    /* Трассы (уровни) */
    .track {{ margin-top: 20px; padding: 22px; border: 1px solid var(--sage-line); border-radius: 16px; background: var(--card) }}
    .track-head {{ display: flex; align-items: center; gap: 10px; margin-bottom: 4px }}
    .track-dot {{ width: 13px; height: 13px; border-radius: 50%; flex: none }}
    .track-dot.green {{ background: var(--green) }}
    .track-dot.blue {{ background: var(--blue) }}
    .track-dot.red {{ background: var(--red) }}
    .track-dot.black {{ background: var(--black) }}
    .track-name {{ margin: 0; font-size: 19px; font-weight: 800; color: var(--ink) }}
    .track-tag {{
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }}
    .track-tag.green {{ background: var(--green-bg); color: var(--green) }}
    .track-tag.blue {{ background: var(--blue-bg); color: var(--blue) }}
    .track-tag.red {{ background: var(--red-bg); color: var(--red) }}
    .track-tag.black {{ background: var(--black-bg); color: var(--black) }}
    .track-desc {{ margin: 4px 0 0; color: var(--muted); font-size: 14.5px }}

    /* Карточки гайдов: плотная сетка, три колонки на широком экране */
    /* auto-fit, а не auto-fill: когда статей в трассе мало, они растягиваются
       на всю ширину, а не жмутся влево с пустотой справа */
    .guides {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 18px }}
    .guide-link {{
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
      padding: 13px 14px;
      border: 1px solid var(--sage-line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.32;
      text-decoration: none;
      box-shadow: 0 3px 0 #AAB9B3;
      transition: transform .12s ease, box-shadow .12s ease;
    }}
    .guide-title {{ display: block }}
    .guide-link.kod-hit {{ border-color: var(--accent) }}
    .guide-link.kod-hit::after {{ content: "по кодовому слову"; display: block; margin-top: 6px; color: var(--accent); font-size: 12px; font-weight: 700 }}
    .kind {{ align-self: flex-start; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase }}
    .kind-instr {{ background: var(--sage); color: var(--muted) }}
    .kind-razbor {{ background: #FDF0CE; color: #8A6410 }}
    .kind-obzor {{ background: #FBE3D2; color: #9C4A1E }}
    .guide-link:hover {{ transform: translateY(2px); box-shadow: 0 1px 0 #AAB9B3 }}
    .guide-link:active {{ transform: translateY(3px); box-shadow: 0 0 0 #AAB9B3 }}
    .soon {{ display: inline-block; margin-top: 16px; padding: 6px 10px; border-radius: 7px; background: var(--sage); color: var(--muted); font-size: 13px; font-weight: 700 }}

    footer {{ padding: 60px 0 70px; color: var(--muted); font-size: 13px }}

    @media (max-width: 720px) {{
      header, main {{ width: min(100% - 28px, 1120px) }}
      header {{ padding-top: 42px }}
      .guides {{ grid-template-columns: 1fr }}
      .toolbar {{ flex-direction: column; align-items: stretch }}
      .search-input {{ flex: 0 0 auto }}
    }}

    @media (prefers-reduced-motion: reduce) {{
      .tag-btn, .tag-btn:hover, .guide-link, .guide-link:hover, .guide-link:active {{
        transition: none; transform: none;
      }}
    }}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">{nadzagolovok}</p>
    <h1>{h1}</h1>
    <p class="lead">{lead}</p>
    <p class="intro">{intro}</p>
    <p class="intro">Гайды размечены по уровню:</p>
    <ul class="levels">
{urovni}
    </ul>
  </header>

  <main>
    <div class="toolbar">
      <input class="search-input" type="search" id="guide-search" placeholder="Тема гайда или кодовое слово" aria-label="Поиск по теме или кодовому слову">
      <div class="tag-filters" id="tag-filters" role="group" aria-label="Фильтр по разделам">
{filtry}
      </div>
    </div>
    <p class="no-results" id="no-results">Ничего не нашлось. Попробуй другое слово или сними фильтр</p>

{razdely}

    <footer>{podval}</footer>
  </main>

  <script>
    var searchInput = document.getElementById('guide-search');
    var tagButtons = document.querySelectorAll('.tag-btn');
    var guideLinks = document.querySelectorAll('.guide-link');
    var noResults = document.getElementById('no-results');
    var activeTag = 'all';

    // Поиск прощает: е/ё, и/й, мягкий знак, одну опечатку в слове от 4 букв,
    // латиницу (транслит «dostup» и забытую раскладку «ljcneg»)
    var RASKLADKA = {{ q:'й', w:'ц', e:'у', r:'к', t:'е', y:'н', u:'г', i:'ш', o:'щ', p:'з', '[':'х', ']':'ъ',
      a:'ф', s:'ы', d:'в', f:'а', g:'п', h:'р', j:'о', k:'л', l:'д', ';':'ж', "'":'э',
      z:'я', x:'ч', c:'с', v:'м', b:'и', n:'т', m:'ь', ',':'б', '.':'ю', '`':'ё' }};
    var TRANSLIT2 = [['shch','щ'], ['sch','щ'], ['zh','ж'], ['kh','х'], ['ch','ч'], ['sh','ш'], ['ts','ц'],
      ['yu','ю'], ['ya','я'], ['yo','е'], ['ye','е'], ['ju','ю'], ['ja','я']];
    var TRANSLIT1 = {{ a:'а', b:'б', v:'в', g:'г', d:'д', e:'е', z:'з', i:'и', j:'и', k:'к', l:'л', m:'м', n:'н',
      o:'о', p:'п', r:'р', s:'с', t:'т', u:'у', f:'ф', h:'х', c:'ц', w:'в', x:'кс', q:'к' }};

    function normalize(value) {{
      return value.toLowerCase().replace(/ё/g, 'е').replace(/й/g, 'и').replace(/[ьъ]/g, '')
        .replace(/[^a-zа-я0-9]+/g, ' ').trim();
    }}

    function rasklad(value) {{
      return value.toLowerCase().split('').map(function (ch) {{ return RASKLADKA[ch] || ch; }}).join('');
    }}

    function translit(value) {{
      var src = value.toLowerCase(), out = '', i = 0;
      while (i < src.length) {{
        var hit = null;
        for (var k = 0; k < TRANSLIT2.length; k++) {{
          if (src.substr(i, TRANSLIT2[k][0].length) === TRANSLIT2[k][0]) {{ hit = TRANSLIT2[k]; break; }}
        }}
        if (hit) {{ out += hit[1]; i += hit[0].length; continue; }}
        var ch = src[i];
        if (ch === 'y') out += /[аеиоуыэюя]$/.test(out) ? 'и' : 'ы';
        else out += TRANSLIT1[ch] || ch;
        i++;
      }}
      return out;
    }}

    // названия сервисов русскими буквами: в статьях они латиницей
    var SINONIMY = {{ 'клод':'claude', 'впн':'vpn', 'эксел':'excel', 'ексел':'excel', 'ворд':'word', 'пдф':'pdf',
      'джимеил':'gmail', 'гмаил':'gmail', 'гугл':'google', 'кодекс':'codex', 'чатгпт':'chatgpt', 'гпт':'gpt',
      'ватсап':'whatsapp', 'вотсап':'whatsapp', 'маркдаун':'markdown' }};

    function sinonimy(value) {{
      return value.split(' ').map(function (w) {{ return SINONIMY[w] || w; }}).join(' ');
    }}

    // варианты запроса: как набрано, раскладка, транслит, сервис латиницей
    function variants(raw) {{
      var list = [normalize(raw)];
      if (/[a-z]/i.test(raw)) {{ list.push(normalize(rasklad(raw))); list.push(normalize(translit(raw))); }}
      list.push(sinonimy(list[0]));
      return list.filter(function (v, i) {{ return v !== '' && list.indexOf(v) === i; }});
    }}

    // расстояние не больше одной правки (замена, пропуск или лишняя буква)
    function oneEdit(a, b) {{
      if (a === b) return true;
      if (Math.abs(a.length - b.length) > 1) return false;
      var i = 0, j = 0, edits = 0;
      while (i < a.length && j < b.length) {{
        if (a[i] === b[j]) {{ i++; j++; continue; }}
        if (++edits > 1) return false;
        if (a.length > b.length) i++;
        else if (a.length < b.length) j++;
        else {{ i++; j++; }}
      }}
      return edits + (a.length - i) + (b.length - j) <= 1;
    }}

    function wordHits(q, words) {{
      return words.some(function (w) {{
        if (w.indexOf(q) !== -1) return true;
        if (q.length < 4) return false;
        // слово целиком или его начало: человек ещё допечатывает
        return oneEdit(q, w) || oneEdit(q, w.slice(0, q.length)) || oneEdit(q, w.slice(0, q.length + 1));
      }});
    }}

    function textMatches(query, text) {{
      if (text.indexOf(query) !== -1) return true;
      var words = text.split(' ');
      return query.split(' ').every(function (q) {{ return wordHits(q, words); }});
    }}

    function kodMatches(query, kod) {{
      return kod !== '' && (query === kod || (kod.length >= 4 && query.indexOf(' ') === -1 && oneEdit(query, kod)));
    }}

    function applyFilters() {{
      var queries = variants(searchInput.value);
      var searching = queries.length > 0;
      var visibleCount = 0;

      guideLinks.forEach(function (link) {{
        var text = normalize(link.textContent + ' ' + (link.getAttribute('data-poisk') || ''));
        var kod = normalize(link.getAttribute('data-kod') || '');
        var tags = (link.getAttribute('data-tags') || '').split(' ');
        // кодовое слово: статья видна при любом фильтре, на одно слово может быть несколько статей
        var kodHit = queries.some(function (q) {{ return kodMatches(q, kod); }});
        var matchesTag = activeTag === 'all' || tags.indexOf(activeTag) !== -1;
        var matchesQuery = !searching || queries.some(function (q) {{ return textMatches(q, text); }});
        var visible = kodHit || (matchesTag && matchesQuery);
        link.style.display = visible ? '' : 'none';
        link.classList.toggle('kod-hit', kodHit);
        if (visible) visibleCount++;
      }});

      document.querySelectorAll('.track').forEach(function (track) {{
        var links = track.querySelectorAll('.guide-link');
        var anyVisible = false;
        links.forEach(function (l) {{ if (l.style.display !== 'none') anyVisible = true; }});
        var emptyTrack = links.length === 0;
        // трасса без своих гайдов («готовится») видна, пока не фильтруют и не ищут
        var keepEmpty = emptyTrack && !searching;
        track.style.display = (keepEmpty || anyVisible) ? '' : 'none';
      }});

      document.querySelectorAll('.tool-block').forEach(function (block) {{
        var section = block.getAttribute('data-section');
        var matchesSection = activeTag === 'all' || section === activeTag;
        var tracks = block.querySelectorAll('.track');
        var anyTrack = false;
        tracks.forEach(function (t) {{ if (t.style.display !== 'none') anyTrack = true; }});
        var kodInBlock = block.querySelector('.guide-link.kod-hit') !== null;
        block.style.display = ((matchesSection || kodInBlock) && anyTrack) ? '' : 'none';
      }});

      noResults.classList.toggle('show', visibleCount === 0 && searching);
    }}

    searchInput.addEventListener('input', applyFilters);

    // Enter при единственном найденном гайде открывает его
    searchInput.addEventListener('keydown', function (event) {{
      if (event.key !== 'Enter') return;
      var shown = Array.prototype.filter.call(guideLinks, function (l) {{ return l.style.display !== 'none'; }});
      if (shown.length === 1 && variants(searchInput.value).length > 0) window.location.href = shown[0].getAttribute('href');
    }});

    tagButtons.forEach(function (btn) {{
      btn.addEventListener('click', function () {{
        tagButtons.forEach(function (b) {{ b.classList.remove('active'); }});
        btn.classList.add('active');
        activeTag = btn.getAttribute('data-tag');
        applyFilters();
      }});
    }});
  </script>
</body>
</html>
