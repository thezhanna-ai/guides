<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Экран импорта памяти в Claude</title>
  <desc id="desc">Учебный пример окна Import memory с готовым запросом, полем для ответа ChatGPT и кнопкой Add to memory</desc>
  <rect width="1600" height="1000" fill="#f7f7f5"/>
  <rect x="0" y="0" width="1600" height="78" fill="#ffffff"/>
  <path d="M0 78H1600" stroke="#e4e2dd"/>
  <text x="48" y="50" fill="#292723" font-family="Arial, sans-serif" font-size="25" font-weight="700">Claude</text>
  <circle cx="1536" cy="39" r="22" fill="#dfd8cf"/>
  <text x="1536" y="46" fill="#554f48" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">Z</text>

  <rect x="315" y="112" width="970" height="820" rx="24" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
  <text x="385" y="184" fill="#24221f" font-family="Arial, sans-serif" font-size="38" font-weight="700">Import memory</text>
  <text x="385" y="226" fill="#716c64" font-family="Arial, sans-serif" font-size="22">Bring useful context from another AI assistant into Claude</text>

  <circle cx="407" cy="300" r="22" fill="#e9e6e1"/>
  <text x="407" y="307" fill="#403c37" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text>
  <text x="450" y="307" fill="#2b2925" font-family="Arial, sans-serif" font-size="27" font-weight="700">Copy the prompt</text>
  <rect x="385" y="340" width="830" height="175" rx="15" fill="#f5f4f1" stroke="#d9d6d0" stroke-width="2"/>
  <text x="415" y="384" fill="#514d47" font-family="Arial, sans-serif" font-size="20">Ask your current AI assistant to export what it knows about you,</text>
  <text x="415" y="418" fill="#514d47" font-family="Arial, sans-serif" font-size="20">including your work, projects, preferences, and response style.</text>
  <rect x="1010" y="452" width="170" height="44" rx="10" fill="#efeee9" stroke="#cbc8c1"/>
  <text x="1095" y="480" fill="#3f3b36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">Copy prompt</text>

  <circle cx="407" cy="586" r="22" fill="#e9e6e1"/>
  <text x="407" y="593" fill="#403c37" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text>
  <text x="450" y="593" fill="#2b2925" font-family="Arial, sans-serif" font-size="27" font-weight="700">Paste the result</text>
  <rect x="385" y="626" width="830" height="178" rx="15" fill="#ffffff" stroke="#aaa69e" stroke-width="2"/>
  <text x="415" y="671" fill="#8a857d" font-family="Arial, sans-serif" font-size="20">Paste the response from ChatGPT here...</text>

  <rect x="1014" y="842" width="202" height="54" rx="12" fill="#c96442"/>
  <text x="1115" y="876" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Add to memory</text>
</svg>
